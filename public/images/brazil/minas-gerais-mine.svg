<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="mineSunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#EA580C"/>
      <stop offset="70%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#3B1C0B"/>
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="50%" stop-color="#713F12"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Golden Hour Sky over Minas Gerais Mountains -->
  <rect width="1600" height="900" fill="url(#mineSunset)"/>

  <!-- Rolling Mountain Ridge Silhouette in Background -->
  <path d="M 0,340 Q 300,280 600,320 T 1200,290 T 1600,320 L 1600,600 L 0,600 Z" fill="#431407" opacity="0.6"/>
  <path d="M 0,380 Q 400,340 850,370 T 1600,350 L 1600,700 L 0,700 Z" fill="#290E05" opacity="0.8"/>

  <!-- Terraced Open-Pit Mine (Concentric Benches & Roads) -->
  <path d="M 300,420 Q 800,400 1400,430 L 1380,480 Q 800,450 320,470 Z" fill="#B45309" opacity="0.85"/>
  <path d="M 340,480 Q 800,460 1360,490 L 1340,540 Q 800,510 360,530 Z" fill="#92400E" opacity="0.85"/>
  <path d="M 380,540 Q 800,520 1320,550 L 1300,600 Q 800,570 400,590 Z" fill="#78350F" opacity="0.9"/>
  <path d="M 420,600 Q 800,580 1280,610 L 1260,660 Q 800,630 440,650 Z" fill="#581C87" opacity="0.3"/>

  <!-- Modern Processing Plant in Middle Distance -->
  <rect x="1100" y="320" width="120" height="60" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <rect x="1220" y="300" width="40" height="80" fill="#CBD5E1"/>
  <rect x="1240" y="270" width="8" height="30" fill="#64748B"/> <!-- Smokestack / vent -->

  <!-- Winding Haulage Roads with Caterpillar Mining Haul Trucks -->
  <g fill="#FBBF24">
    <!-- Truck 1 on terrace -->
    <rect x="1160" y="470" width="36" height="20" rx="3"/>
    <circle cx="1168" cy="492" r="5" fill="#18181B"/>
    <circle cx="1188" cy="492" r="5" fill="#18181B"/>
    <!-- Truck 2 deeper down -->
    <rect x="1280" y="580" width="44" height="24" rx="4"/>
    <circle cx="1290" cy="606" r="6" fill="#18181B"/>
    <circle cx="1314" cy="606" r="6" fill="#18181B"/>
  </g>

  <!-- Excavator on pit floor -->
  <rect x="1050" y="540" width="30" height="18" fill="#F59E0B"/>
  <line x1="1050" y1="540" x2="1025" y2="520" stroke="#B45309" stroke-width="4"/>
  <line x1="1025" y1="520" x2="1010" y2="550" stroke="#B45309" stroke-width="4"/>

  <!-- Foreground Rocky Ridge Overlook (Left & Bottom) -->
  <polygon points="0,520 600,480 720,680 900,900 0,900" fill="url(#terraceGrad)"/>
  <polygon points="120,620 540,580 660,780 800,900 0,900" fill="#291206"/>

  <!-- Geological Sample Cloth & Sacks -->
  <polygon points="150,680 440,650 460,740 180,780" fill="#D6C7A1" stroke="#A89F82" stroke-width="2"/>
  <!-- Rock Ore Samples on Cloth (Rich Lithium/Rare-Earth specimens) -->
  <polygon points="260,660 300,640 330,670 290,690" fill="#475569" stroke="#94A3B8" stroke-width="2"/>
  <polygon points="340,670 380,655 400,685 360,700" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="300,685 340,675 350,715 310,725" fill="#334155" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Rock Hammer on Ground -->
  <line x1="140" y1="720" x2="380" y2="790" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <line x1="140" y1="720" x2="380" y2="790" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Steel Hammer Head -->
  <polygon points="360,770 410,785 390,820 340,805" fill="#94A3B8" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Female Geologist Crouched on Rocky Ridge (Center-Left) -->
  <!-- Legs / Cargo Pants (Khaki) -->
  <path d="M 120,660 L 260,600 L 320,740 L 200,820 Z" fill="#645543"/>
  <path d="M 280,620 L 390,620 L 410,780 L 320,780 Z" fill="#524536"/>
  <!-- Safety Boots -->
  <polygon points="180,810 240,810 230,860 170,860" fill="#1C1917"/>

  <!-- High-Visibility Work Jacket (Bright Orange with Navy & Reflective Stripes) -->
  <path d="M 200,380 L 380,360 L 420,580 L 240,600 Z" fill="#EA580C"/>
  <path d="M 200,440 L 390,420 L 400,500 L 210,520 Z" fill="#1E3A8A"/> <!-- Navy lower section -->
  <!-- Silver reflective stripe -->
  <line x1="205" y1="460" x2="395" y2="440" stroke="#FFFFFF" stroke-width="8" opacity="0.9"/>

  <!-- Arms holding and examining ore sample -->
  <path d="M 330,410 L 450,440 L 490,480 L 430,510 Z" fill="#EA580C"/>
  <!-- Hand holding mineral stone -->
  <circle cx="490" cy="470" r="18" fill="#C28762"/>
  <polygon points="480,450 515,440 530,470 500,485" fill="#64748B" stroke="#F1F5F9" stroke-width="2"/> <!-- Glowing mineral in hand -->

  <!-- Head with White Hardhat & Protective Safety Glasses -->
  <circle cx="370" cy="275" r="45" fill="#C28762"/>
  <!-- Ponytail hair -->
  <path d="M 330,260 Q 300,290 280,350 L 310,360 Q 340,300 350,280 Z" fill="#18181B"/>
  <!-- White Hardhat -->
  <path d="M 320,260 Q 370,160 430,250 L 450,270 L 310,270 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
  <path d="M 300,270 L 460,265 L 450,280 L 305,285 Z" fill="#E2E8F0"/> <!-- Brim -->
  <!-- Safety Glasses / Visor -->
  <polygon points="380,270 430,270 420,295 385,295" fill="#38BDF8" opacity="0.6"/>

  <!-- Editorial Ribbon -->
  <rect x="40" y="40" width="440" height="48" rx="8" fill="#000000" opacity="0.75"/>
  <text x="60" y="72" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#F59E0B" letter-spacing="2">
    FIG. 4 · CRITICAL MINERALS IN MINAS GERAIS
  </text>
</svg>
