<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="35%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="tableReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Sky & Horizon -->
  <rect width="1600" height="900" fill="url(#cloudySky)"/>

  <!-- Landscape: Lake Paranoá & Brasília Skyline -->
  <rect x="0" y="320" width="1600" height="150" fill="#3B82F6" opacity="0.35"/>
  <rect x="0" y="380" width="1600" height="100" fill="#334155" opacity="0.5"/>

  <!-- National Congress Twin Towers in Center Background -->
  <rect x="940" y="180" width="30" height="230" fill="#F8FAFC" opacity="0.85"/>
  <rect x="975" y="180" width="30" height="230" fill="#E2E8F0" opacity="0.85"/>
  <ellipse cx="850" cy="385" rx="70" ry="25" fill="#F8FAFC" opacity="0.8"/>
  <ellipse cx="1120" cy="385" rx="80" ry="25" fill="#F8FAFC" opacity="0.8"/>

  <!-- Interior Boardroom: Modern Glass Enclosure -->
  <rect x="0" y="440" width="1600" height="460" fill="url(#tableReflect)"/>

  <!-- Glass Vertical Dividers with Subtle Reflections -->
  <line x1="420" y1="0" x2="420" y2="900" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>
  <line x1="880" y1="0" x2="880" y2="900" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
  <line x1="1300" y1="0" x2="1300" y2="900" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>

  <!-- Brazilian Flag (Left Corner of Boardroom) -->
  <g transform="translate(430, 180)">
    <rect x="0" y="0" width="100" height="340" fill="#15803D" opacity="0.95"/>
    <polygon points="50,40 90,140 50,240 10,140" fill="#EAB308"/>
    <circle cx="50" cy="140" r="28" fill="#1E3A8A"/>
    <path d="M 28,140 Q 50,130 72,145" stroke="#FFFFFF" stroke-width="4" fill="none"/>
  </g>

  <!-- United States Flag (Right Corner of Boardroom) -->
  <g transform="translate(1250, 190)">
    <!-- Stripes -->
    <rect x="0" y="0" width="90" height="320" fill="#B91C1C"/>
    <rect x="15" y="0" width="15" height="320" fill="#FFFFFF"/>
    <rect x="45" y="0" width="15" height="320" fill="#FFFFFF"/>
    <rect x="75" y="0" width="15" height="320" fill="#FFFFFF"/>
    <!-- Blue Canton with stars -->
    <rect x="0" y="0" width="55" height="150" fill="#1E3A8A"/>
    <circle cx="15" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="25" cy="50" r="3" fill="#FFFFFF"/>
    <circle cx="15" cy="75" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="75" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Conference Table with Glossy Reflection -->
  <polygon points="0,580 1600,580 1600,680 0,680" fill="#090D16" stroke="#475569" stroke-width="2"/>
  <polygon points="0,680 1600,680 1600,900 0,900" fill="#030712"/>

  <!-- Diplomatic Delegates in Silhouette Seated Around Table -->
  <!-- Left Side (Brazilian Delegation) -->
  <g fill="#020617">
    <!-- Delegate 1 -->
    <circle cx="180" cy="460" r="36"/>
    <path d="M 120,510 L 240,510 L 250,680 L 110,680 Z"/>
    <!-- Delegate 2 -->
    <circle cx="340" cy="470" r="34"/>
    <path d="M 290,520 L 390,520 L 400,680 L 280,680 Z"/>
    <!-- Delegate 3 -->
    <circle cx="480" cy="480" r="32"/>
    <path d="M 430,525 L 530,525 L 540,680 L 420,680 Z"/>
  </g>

  <!-- Center Delegates (Presiding) -->
  <g fill="#020617">
    <circle cx="780" cy="450" r="40"/>
    <path d="M 700,505 L 860,505 L 870,680 L 690,680 Z"/>
    <circle cx="940" cy="460" r="38"/>
    <path d="M 870,515 L 1010,515 L 1020,680 L 860,680 Z"/>
  </g>

  <!-- Right Side (US / Foreign Delegation) -->
  <g fill="#020617">
    <circle cx="1120" cy="460" r="38"/>
    <path d="M 1050,515 L 1190,515 L 1200,680 L 1040,680 Z"/>
    <circle cx="1280" cy="470" r="36"/>
    <path d="M 1220,525 L 1340,525 L 1350,680 L 1210,680 Z"/>
  </g>

  <!-- Chrome Executive Chairs -->
  <path d="M 680,510 Q 780,480 880,510 L 890,750 L 670,750 Z" fill="none" stroke="#64748B" stroke-width="4" opacity="0.6"/>
  <path d="M 1030,510 Q 1120,480 1210,510 L 1220,750 L 1020,750 Z" fill="none" stroke="#64748B" stroke-width="4" opacity="0.6"/>

  <!-- Water glasses & briefing dossier folders on table -->
  <g fill="#94A3B8" opacity="0.65">
    <rect x="360" y="590" width="12" height="20" rx="2"/>
    <rect x="520" y="595" width="45" height="10" rx="1"/>
    <rect x="760" y="590" width="14" height="22" rx="2"/>
    <rect x="910" y="595" width="50" height="10" rx="1"/>
    <rect x="1100" y="590" width="14" height="22" rx="2"/>
  </g>

  <!-- Editorial Ribbon -->
  <rect x="40" y="40" width="450" height="48" rx="8" fill="#000000" opacity="0.7"/>
  <text x="60" y="72" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#E2E8F0" letter-spacing="2">
    FIG. 2 · DIPLOMACY &amp; SOVEREIGN PRESSURE
  </text>
</svg>
