<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="kitchenNight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18131E"/>
      <stop offset="50%" stop-color="#100C14"/>
      <stop offset="100%" stop-color="#070509"/>
    </linearGradient>
    <radialGradient id="tableLampGlow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bluePhoneScreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Atmospheric Kitchen/Dining Room -->
  <rect width="1600" height="900" fill="url(#kitchenNight)"/>
  <rect width="1600" height="900" fill="url(#tableLampGlow)"/>

  <!-- Background Living Room (Soft warm tungsten light) -->
  <!-- Refrigerator & Cabinets on Left -->
  <rect x="220" y="80" width="220" height="520" fill="#334155" opacity="0.4"/>
  <line x1="330" y1="80" x2="330" y2="600" stroke="#1E293B" stroke-width="4"/>

  <!-- Warm living room vignette in background right -->
  <rect x="950" y="240" width="550" height="340" rx="12" fill="#2E1C14" opacity="0.6"/>
  <ellipse cx="1200" cy="460" rx="190" ry="60" fill="#451A03" opacity="0.7"/> <!-- Sofa -->
  <!-- Mother reading to child on sofa -->
  <circle cx="1160" cy="380" r="26" fill="#D97706" opacity="0.8"/>
  <rect x="1140" y="410" width="50" height="70" fill="#78350F" opacity="0.8"/>
  <circle cx="1210" cy="405" r="18" fill="#FBBF24" opacity="0.85"/>
  <rect x="1195" y="425" width="40" height="50" fill="#92400E" opacity="0.8"/>
  <!-- Bedtime book -->
  <polygon points="1170,440 1200,430 1205,455 1175,465" fill="#FEF08A"/>

  <!-- Foreground Wooden Dining Table -->
  <polygon points="0,540 1600,540 1600,900 0,900" fill="#2E1A11" stroke="#451A03" stroke-width="3"/>
  <polygon points="0,620 1600,620 1600,900 0,900" fill="#1C100A"/>

  <!-- Stacks of Unpaid Bills, Invoices, Barcode Slips (Boleto Bancário) -->
  <!-- Paper 1 -->
  <polygon points="460,630 760,590 810,750 510,790" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="500" y1="640" x2="720" y2="615" stroke="#94A3B8" stroke-width="3"/>
  <line x1="510" y1="670" x2="730" y2="645" stroke="#94A3B8" stroke-width="3"/>
  <!-- Barcode on boleto -->
  <rect x="530" y="720" width="200" height="24" fill="#0F172A"/>

  <!-- Paper 2 (Overlapping) -->
  <polygon points="680,620 1020,620 1010,810 670,810" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <line x1="710" y1="650" x2="980" y2="650" stroke="#64748B" stroke-width="4"/>
  <line x1="710" y1="680" x2="960" y2="680" stroke="#64748B" stroke-width="3"/>
  <line x1="710" y1="710" x2="940" y2="710" stroke="#DC2626" stroke-width="4"/> <!-- Red overdue warning -->
  <rect x="710" y="740" width="240" height="30" fill="#0F172A"/>

  <!-- Paper 3 -->
  <polygon points="860,650 1180,630 1190,830 870,850" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>

  <!-- Electronic Calculator on Table -->
  <rect x="360" y="650" width="110" height="160" rx="8" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <rect x="375" y="665" width="80" height="35" rx="3" fill="#A3E635"/>
  <text x="390" y="690" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#14532D">
    -49.9%
  </text>
  <!-- Buttons -->
  <g fill="#475569">
    <rect x="375" y="715" width="20" height="15" rx="2"/>
    <rect x="405" y="715" width="20" height="15" rx="2"/>
    <rect x="435" y="715" width="20" height="15" rx="2"/>
    <rect x="375" y="740" width="20" height="15" rx="2"/>
    <rect x="405" y="740" width="20" height="15" rx="2"/>
    <rect x="435" y="740" width="20" height="15" rx="2"/>
    <rect x="375" y="765" width="20" height="15" rx="2"/>
    <rect x="405" y="765" width="20" height="15" rx="2"/>
    <rect x="435" y="765" width="20" height="15" rx="2" fill="#DC2626"/>
  </g>

  <!-- Credit Card on Table -->
  <rect x="490" y="760" width="120" height="75" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2" transform="rotate(-10 550 795)"/>
  <rect x="500" y="780" width="22" height="18" rx="3" fill="#FBBF24" transform="rotate(-10 550 795)"/>

  <!-- Coffee Mug -->
  <ellipse cx="260" cy="670" rx="30" ry="12" fill="#D97706"/>
  <rect x="230" y="630" width="60" height="50" rx="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>

  <!-- The Anxious Father Seated at Table (Center Left) -->
  <!-- Torso in dark green shirt -->
  <path d="M 520,380 L 800,380 L 820,620 L 500,620 Z" fill="#2E382E"/>

  <!-- Head with dark curly hair -->
  <circle cx="660" cy="220" r="65" fill="#C28762"/>
  <!-- Curly dark hair silhouette -->
  <path d="M 590,200 Q 640,110 730,190 Q 750,260 720,290 Q 680,240 600,240 Z" fill="#111827"/>
  <!-- Hand clutching chin in anxious thought -->
  <circle cx="680" cy="310" r="28" fill="#C28762"/>
  <path d="M 660,330 L 700,310 L 750,420 L 680,440 Z" fill="#C28762"/>

  <!-- Left Hand holding phone -->
  <path d="M 540,420 L 620,490 L 670,490 L 600,410 Z" fill="#B07552"/>

  <!-- Glowing Smartphone Screen reflecting onto face & chest -->
  <rect x="620" y="470" width="45" height="85" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="3" transform="rotate(-5 642 512)"/>
  <rect x="625" y="475" width="35" height="75" rx="3" fill="#60A5FA" transform="rotate(-5 642 512)"/>
  <!-- Specular blue light cone from phone -->
  <circle cx="640" cy="510" r="160" fill="url(#bluePhoneScreen)"/>

  <!-- Blue reflection on face & eyes -->
  <ellipse cx="645" cy="245" rx="20" ry="30" fill="#93C5FD" opacity="0.45"/>

  <!-- Editorial Ribbon -->
  <rect x="40" y="40" width="410" height="48" rx="8" fill="#000000" opacity="0.75"/>
  <text x="60" y="72" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#F87171" letter-spacing="2">
    FIG. 3 · THE HOUSEHOLD DEBT TRAP
  </text>
</svg>
